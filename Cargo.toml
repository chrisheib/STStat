[package]
name = "ststat"
version = "0.1.11"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
debug = true

[dependencies]
# active-win-pos-rs = "0.8.1"
chrono = "0.4"
color-eyre = "0.6.3"
ctrlc = "3"
display-info = "0.4"
eframe = "0.31"
egui_extras = "0.31"
egui_plot = "0.31"
# ekko = "0.7"
itertools = "0.11.0"
lazy_static = "1"
lsblk = "0.5.0"
# nvml-wrapper = "0.10" not really working because of inconsistent linux libraries :/ need nvml_lib in the exact same version as the installed driver.
parking_lot = "0.12"
procfs = "0.17.0"
procspawn = { version = "1.0.1", default-features = false, features = [
    "safe-shared-libraries",
] }
reqwest = { version = "0.11", features = ["blocking", "serde_json", "json"] }
self_update = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The performance hit of running this multithreaded is not worth it.
sysinfo = { version = "0.36", default-features = false, features = [
    "component",
    "disk",
    "network",
    "system",
    "user",
] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros"] }
winit = "0.30.8"
# windows = { version = "0.48", features = [
#     "Win32_UI_Shell",
#     "Win32_Foundation",
#     "Win32_Graphics_Dwm",
#     "Win32_UI_WindowsAndMessaging",
#     "Win32_System_Performance",
#     "Win32_Storage_FileSystem",
#     "Win32_System_SystemInformation",
#     "Win32_Graphics_Gdi",
# ] }
